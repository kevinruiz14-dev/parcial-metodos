<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Regresión Numérica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
        header { background: #1a237e; color: white; padding: 20px; text-align: center; }
        header h1 { font-size: 24px; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 10px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #1a237e; margin-bottom: 15px; font-size: 18px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
        .fila-dato { display: flex; gap: 10px; }
        .fila-dato input { margin-bottom: 8px; }
        button { background: #1a237e; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 15px; width: 100%; }
        button:hover { background: #283593; }
        .btn-agregar { background: #388e3c; width: auto; padding: 8px 16px; font-size: 13px; margin-bottom: 12px; }
        .resultado { background: #e8eaf6; border-left: 4px solid #1a237e; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .resultado pre { font-size: 14px; white-space: pre-wrap; }
        img { width: 100%; border-radius: 8px; margin-top: 10px; }
        .oculto { display: none; }
        .tipos { display: flex; gap: 10px; margin-bottom: 15px; }
        .tipo-btn { flex: 1; padding: 10px; border: 2px solid #1a237e; background: white; color: #1a237e; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tipo-btn.activo { background: #1a237e; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>📈 Sistema de Regresión Numérica</h1>
        <p>Lineal · Cuadrática · Exponencial</p>
    </header>

    <div class="container">
        <!-- Tipo de regresión -->
        <div class="card">
            <h2>1. Selecciona el tipo de regresión</h2>
            <div class="tipos">
                <button class="tipo-btn activo" onclick="seleccionar('lineal', this)">Lineal</button>
                <button class="tipo-btn" onclick="seleccionar('cuadratica', this)">Cuadrática</button>
                <button class="tipo-btn" onclick="seleccionar('exponencial', this)">Exponencial</button>
            </div>
            <input type="hidden" id="tipo" value="lineal">
        </div>

        <!-- Ingreso de datos -->
        <div class="card">
            <h2>2. Ingresa los datos</h2>
            <div id="datos">
                <div class="fila-dato">
                    <input type="number" step="any" placeholder="t" class="t-input">
                    <input type="number" step="any" placeholder="Y" class="y-input">
                </div>
                <div class="fila-dato">
                    <input type="number" step="any" placeholder="t" class="t-input">
                    <input type="number" step="any" placeholder="Y" class="y-input">
                </div>
            </div>
            <button class="btn-agregar" onclick="agregarFila()">+ Agregar fila</button>

            <label>Valor de t para proyectar:</label>
            <input type="number" step="any" id="t_proyectar" placeholder="Ej: 6">

            <button onclick="calcular()">Calcular regresión</button>
        </div>

        <!-- Resultados -->
        <div class="card oculto" id="seccion-resultados">
            <h2>3. Resultados</h2>
            <div class="resultado">
                <pre id="texto-resultado"></pre>
            </div>
            <img id="grafica" src="" alt="Gráfica de regresión">
        </div>
    </div>

    <script>
        function seleccionar(tipo, btn) {
            document.getElementById('tipo').value = tipo;
            document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('activo'));
            btn.classList.add('activo');
        }

        function agregarFila() {
            const div = document.createElement('div');
            div.className = 'fila-dato';
            div.innerHTML = `<input type="number" step="any" placeholder="t" class="t-input">
                             <input type="number" step="any" placeholder="Y" class="y-input">`;
            document.getElementById('datos').appendChild(div);
        }

        async function calcular() {
            const tipo = document.getElementById('tipo').value;
            const t_vals = [...document.querySelectorAll('.t-input')].map(i => parseFloat(i.value)).filter(v => !isNaN(v));
            const y_vals = [...document.querySelectorAll('.y-input')].map(i => parseFloat(i.value)).filter(v => !isNaN(v));
            const t_proyectar = parseFloat(document.getElementById('t_proyectar').value);

            if (t_vals.length < 2) { alert('Ingresa al menos 2 pares de datos.'); return; }
            if (isNaN(t_proyectar)) { alert('Ingresa un valor de t para proyectar.'); return; }

            const res = await fetch('/calcular', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tipo, t_vals, y_vals, t_proyectar })
            });
            const data = await res.json();

            if (data.error) { alert('Error: ' + data.error); return; }

            document.getElementById('texto-resultado').textContent = data.texto;
            document.getElementById('grafica').src = 'data:image/png;base64,' + data.grafica;
            document.getElementById('seccion-resultados').classList.remove('oculto');
        }
    </script>
</body>
</html>
